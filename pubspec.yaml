name: broken_glass
description: "Break any Flutter widget like a pane of glass — radial fractures, tumbling shards and lit edges."
version: 0.1.0
homepage: https://github.com/NJashwanth/broken_glass
repository: https://github.com/NJashwanth/broken_glass
issue_tracker: https://github.com/NJashwanth/broken_glass/issues

topics:
  - animation
  - effects
  - ui

screenshots:
  - description: "Glass cracked around the point of impact."
    path: doc/cracked.png
  - description: "Shards tumbling away mid-break."
    path: doc/breaking.png
  - description: "Spider-web cracks left in place."
    path: doc/spider_web.png

# Color.withValues / Color.a are the newest APIs used; both landed in
# Flutter 3.27 (Dart 3.6).
environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
